# GNU mcview / mc(1) Internal File Viewer: when a processing filter is listed
# for the type, the viewer shows the filter stdout (decoded payload), including
# hex mode. Helpers match public GNU mc.ext View lines (gzip -dc, bzip2 -dc,
# xz -dc / xzcat, zstd -dc, lz4 -dc, lzip -dc). Archives (.tar.gz / .tgz) are
# not listed here — F3/Enter still VFS-enters those.
[view]
.gz = gzip -dc
.bz2 = bzip2 -dc
.xz = xz -dc
.zst = zstd -dc
.lz4 = lz4 -dc
.lzma = xz -dc
.lz = lzip -dc
