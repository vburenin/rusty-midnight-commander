# Rusty Midnight Commander - Minimal extension map (Apache-2.0 original)
#
# Format:
#   [extfs]
#   <shortname> = <helper-command-path>
#   [extensions]
#   .ext = <shortname>
#   [open]
#   .ext = view        # same as F3 (internal or external viewer)
#   .ext = xdg-open    # desktop opener, or $MC_OPEN if set
#   .ext = open        # alias of xdg-open
#   .ext = enter       # VFS enter (archives / extfs); alias: vfs
#   [view]
#   .ext = gzip -dc    # F3 / mcview: pipe file through helper; stdout is decoded bytes
#
# Original Apache-2.0 rules. Same *behavior categories* as GNU mc Open
# (view text, desktop-open media/docs, enter archives) using replica
# handlers only: F3 viewer, xdg-open, VFS enter_path. Not GPL mc.ext.ini.
#
# Example: .lsar files opened by the "ls-archive" helper.

[extfs]
lsarc = extfs/ls-archive

[extensions]
.lsar = lsarc

[open]
