# Rusty Midnight Commander - Minimal extension map (Apache-2.0 original)
#
# Format:
#   [extfs]
#   <shortname> = <helper-command-path>
#   [extensions]
#   .ext = <shortname>
#   [open]
#   .ext = view        # same as F3 (internal or external viewer)
#   .ext = xdg-open    # desktop opener, or $MC_OPEN if set
#   .ext = open        # alias of xdg-open
#
# Example: .lsar files opened by the "ls-archive" helper.

[extfs]
lsarc = extfs/ls-archive

[extensions]
.lsar = lsarc

[open]
.txt = view
.md = view
.rs = view
.c = view
.h = view
.cc = view
.cpp = view
.cxx = view
.hh = view
.hpp = view
.py = view
.js = view
.ts = view
.json = view
.toml = view
.yaml = view
.yml = view
.xml = view
.ini = view
.log = view
.sh = view
.bash = view
.zsh = view
.diff = view
.patch = view
.css = view
.go = view
.java = view
.kt = view
.rb = view
.php = view
.lua = view
.html = xdg-open
.htm = xdg-open
.pdf = xdg-open
.png = xdg-open
.jpg = xdg-open
.jpeg = xdg-open
.gif = xdg-open
.svg = xdg-open
.webp = xdg-open
.bmp = xdg-open
.tif = xdg-open
.tiff = xdg-open
.mp4 = xdg-open
.webm = xdg-open
.mp3 = xdg-open
.wav = xdg-open
.ogg = xdg-open
.epub = xdg-open
.odt = xdg-open
.ods = xdg-open
.odp = xdg-open
.doc = xdg-open
.docx = xdg-open
.xls = xdg-open
.xlsx = xdg-open
.ppt = xdg-open
.pptx = xdg-open
