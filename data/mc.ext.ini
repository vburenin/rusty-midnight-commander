# Rusty Midnight Commander - Minimal extfs mapping (Apache-2.0 original)
#
# Format:
#   [extfs]
#   <shortname> = <helper-command-path>
#   [extensions]
#   .ext = <shortname>
#
# Example: .lsar files opened by the "ls-archive" helper.

[extfs]
lsarc = extfs/ls-archive

[extensions]
.lsar = lsarc

