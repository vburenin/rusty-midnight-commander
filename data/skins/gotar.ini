; Apache-2.0 original skin data for Rusty Midnight Commander
; This file uses GNU MC-compatible section/key names (colors only).
; No GPL text is copied. Color pairs are expressed as fg;background.
; Unknown sections/keys are ignored by the loader.
;
; Palette: gray panels with cyan highlights.

[core]
_default_  = black;gray
selected   = black;cyan
marked     = darkblue;gray
markselect = darkblue;cyan
header     = darkblue;gray
frame      = black;gray
shadow     = darkgray;black

[dialog]
_default_ = black;lightgray
dfocus    = black;cyan
dtitle    = darkcyan;lightgray

[menu]
_default_ = black;lightgray
menusel   = white;cyan
menuhot   = darkcyan;lightgray

[buttonbar]
hotkey = cyan;black
button = black;gray

[statusbar]
_default_ = black;cyan

[filehighlight]
directory  = darkblue
executable = darkgreen
archive    = darkmagenta
source     = darkcyan
symlink    = black

[viewer]
_default_  = black;gray
selected  = darkblue;cyan
