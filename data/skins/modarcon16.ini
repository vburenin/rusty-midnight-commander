; Apache-2.0 original skin data for Rusty Midnight Commander
; This file uses GNU MC-compatible section/key names (colors only).
; No GPL text is copied. Color pairs are expressed as fg;background.
; Unknown sections/keys are ignored by the loader.
;
; Palette: 16-color dark-blue console (darkblue panels, cyan selection).

[core]
_default_  = lightgray;darkblue
selected   = black;cyan
marked     = yellow;darkblue
markselect = yellow;cyan
header     = white;darkblue
frame      = cyan;darkblue
shadow     = darkgray;black

[dialog]
_default_ = black;cyan
dfocus    = white;darkblue
dtitle    = darkblue;cyan

[menu]
_default_ = black;cyan
menusel   = white;darkblue
menuhot   = yellow;cyan

[buttonbar]
hotkey = cyan;black
button = black;cyan

[statusbar]
_default_ = black;cyan

[filehighlight]
directory  = white
executable = brightgreen
archive    = brightmagenta
source     = cyan
symlink    = lightgray

[viewer]
_default_  = lightgray;darkblue
selected  = yellow;cyan
