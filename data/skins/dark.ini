; Apache-2.0 original skin data for Rusty Midnight Commander
; This file uses GNU MC-compatible section/key names (colors only).
; No GPL text is copied. Color pairs are expressed as fg;background.
; Unknown sections/keys are ignored by the loader.
;
; Palette: dark panels (lightgray/white on black, cyan selection).

[core]
_default_  = lightgray;black
selected   = black;cyan
marked     = yellow;black
markselect = yellow;cyan
header     = white;black
frame      = lightgray;black
shadow     = darkgray;black
hintbar    = default;default

[dialog]
_default_ = white;darkgray
dfocus    = black;cyan
dtitle    = cyan;darkgray

[menu]
_default_ = white;darkgray
menusel   = black;cyan
menuhot   = yellow;darkgray

[buttonbar]
hotkey = white;black
button = black;cyan

[statusbar]
_default_ = black;cyan

[filehighlight]
directory  = white
executable = brightgreen
archive    = brightmagenta
source     = cyan
symlink    = lightgray

[viewer]
_default_  = lightgray;black
selected  = yellow;cyan

[editor]
_default_ = lightgray;black
editbold = yellow;green
editmarked = black;cyan
editwhitespace = brightblue;black
editlinestate = white;cyan
