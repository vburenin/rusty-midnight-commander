; Apache-2.0 original skin data for Rusty Midnight Commander
; This file uses GNU MC-compatible section/key names (colors only).
; No GPL text is copied. Color pairs are expressed as fg;background.
; Unknown sections/keys are ignored by the loader.
;
; Palette: 16-color xoria256-like (lightgray on black, slate selection, tan headers).

[core]
_default_  = lightgray;black
selected   = white;darkmagenta
marked     = yellow;black
markselect = yellow;darkmagenta
header     = darkyellow;black
frame      = darkgray;black
shadow     = darkgray;black

[dialog]
_default_ = black;lightgray
dfocus    = white;darkmagenta
dtitle    = darkmagenta;lightgray

[menu]
_default_ = lightgray;darkgray
menusel   = white;darkmagenta
menuhot   = yellow;darkgray

[buttonbar]
hotkey = yellow;black
button = lightgray;darkgray

[statusbar]
_default_ = lightgray;darkgray

[filehighlight]
directory  = white
executable = brightgreen
archive    = magenta
source     = cyan
symlink    = darkgray

[viewer]
_default_  = lightgray;black
selected  = yellow;darkmagenta
