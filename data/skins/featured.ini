; Apache-2.0 original skin data for Rusty Midnight Commander
; This file uses GNU MC-compatible section/key names (colors only).
; No GPL text is copied. Color pairs are expressed as fg;background.
; Unknown sections/keys are ignored by the loader.
;
; Palette: featured 16-color (white on darkblue, yellow selection, magenta marks).

[core]
_default_  = white;darkblue
selected   = black;yellow
marked     = brightmagenta;darkblue
markselect = brightmagenta;yellow
header     = yellow;darkblue
frame      = cyan;darkblue
shadow     = black;black

[dialog]
_default_ = black;cyan
dfocus    = black;yellow
dtitle    = yellow;cyan

[menu]
_default_ = black;cyan
menusel   = yellow;black
menuhot   = yellow;cyan

[buttonbar]
hotkey = yellow;black
button = black;cyan

[statusbar]
_default_ = yellow;blue

[filehighlight]
directory  = cyan
executable = brightgreen
archive    = brightmagenta
source     = yellow
symlink    = lightgray

[viewer]
_default_  = white;darkblue
selected  = yellow;cyan
