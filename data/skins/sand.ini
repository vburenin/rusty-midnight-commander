; Apache-2.0 original skin data for Rusty Midnight Commander
; This file uses GNU MC-compatible section/key names (colors only).
; No GPL text is copied. Color pairs are expressed as fg;background.
; Unknown sections/keys are ignored by the loader.
;
; Palette: warm sand/brown panels (black on darkyellow, yellow selection).

[core]
_default_  = black;darkyellow
selected   = black;yellow
marked     = darkred;darkyellow
markselect = darkred;yellow
header     = darkred;darkyellow
frame      = black;darkyellow
shadow     = black;black

[dialog]
_default_ = black;yellow
dfocus    = black;darkyellow
dtitle    = darkred;yellow

[menu]
_default_ = black;yellow
menusel   = yellow;black
menuhot   = darkred;yellow

[buttonbar]
hotkey = yellow;black
button = black;darkyellow

[statusbar]
_default_ = black;yellow

[filehighlight]
directory  = darkred
executable = darkgreen
archive    = red
source     = blue
symlink    = black
