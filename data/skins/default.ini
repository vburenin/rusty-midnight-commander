; Apache-2.0 original skin data for Rusty Midnight Commander
; This file expresses the default MC visual palette using factual color names/pairs.
; No GPL content is copied. Color names are a public visual specification.
;
; Colors are specified as "foreground;background" using common terminal color names:
; black, red, green, yellow, blue, magenta, cyan, white, lightgray, darkgray,
; brightgreen, brightmagenta.
;
; Only the pairs used by the current UI are defined.

[pairs]
; Core UI (panels and general background)
core_default = lightgray;blue
selected     = black;cyan
marked       = yellow;blue
markselect   = yellow;cyan
header       = yellow;blue
frame        = lightgray;blue
shadow       = lightgray;black

; Dialogs
dialog_default = black;lightgray
dfocus         = black;cyan
dtitle         = blue;lightgray

; Menus
menu     = white;cyan
menusel  = white;black
menuhot  = yellow;cyan

; Button bar and status
buttonbar_hotkey = white;black
buttonbar_button = black;cyan
statusbar        = black;cyan

[filehighlight]
; File type colors used in listings
dir      = white
exec     = brightgreen
archive  = brightmagenta
source   = cyan
symlink  = lightgray

