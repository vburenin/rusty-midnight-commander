; Apache-2.0 original skin data for Rusty Midnight Commander
; This file uses GNU MC-compatible section/key names (colors only).
; No GPL text is copied. Color pairs are expressed as fg;background.
; Unknown sections/keys are ignored by the loader.
;
; Palette: green-gray classic-ish (green/black/gray).

[core]
_default_  = green;black
selected   = black;green
marked     = yellow;black
markselect = yellow;green
header     = brightgreen;black
frame      = green;black
shadow     = lightgray;black

[dialog]
_default_ = black;lightgray
dfocus    = black;green
dtitle    = green;lightgray

[menu]
_default_ = black;lightgray
menusel   = green;black
menuhot   = yellow;lightgray

[buttonbar]
hotkey = green;black
button = black;lightgray

[statusbar]
_default_ = black;green

[filehighlight]
directory  = white
executable = brightgreen
archive    = yellow
source     = cyan
symlink    = lightgray
