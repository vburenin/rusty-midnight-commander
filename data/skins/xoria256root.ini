; Apache-2.0 original skin data for Rusty Midnight Commander
; This file uses GNU MC-compatible section/key names (colors only).
; No GPL text is copied. Color pairs are expressed as fg;background.
; Unknown sections/keys are ignored by the loader.
;
; Palette: 16-color xoria256root-like (lightgray on black, red root accents).

[core]
_default_  = lightgray;black
selected   = white;darkred
marked     = yellow;black
markselect = yellow;darkred
header     = red;black
frame      = darkgray;black
shadow     = darkgray;black
hintbar    = default;default

[dialog]
_default_ = black;lightgray
dfocus    = white;darkred
dtitle    = darkred;lightgray

[menu]
_default_ = lightgray;darkgray
menusel   = white;darkred
menuhot   = red;darkgray

[buttonbar]
hotkey = red;black
button = lightgray;darkgray

[statusbar]
_default_ = lightgray;darkred

[filehighlight]
directory  = white
executable = brightgreen
archive    = red
source     = cyan
symlink    = darkgray

[viewer]
_default_  = lightgray;black
selected  = yellow;darkred

[editor]
_default_ = lightgray;black
editbold = yellow;green
editmarked = black;cyan
editwhitespace = brightblue;black
editlinestate = white;cyan
