; Apache-2.0 original skin data for Rusty Midnight Commander
; This file uses GNU MC-compatible section/key names (colors only).
; No GPL text is copied. Color pairs are expressed as fg;background.
; Unknown sections/keys are ignored by the loader.
;
; Palette: 16-color sand256-like (black on yellow sand, darkred selection).

[core]
_default_  = black;yellow
selected   = yellow;darkred
marked     = darkred;yellow
markselect = yellow;darkred
header     = darkred;yellow
frame      = black;yellow
shadow     = darkyellow;black

[dialog]
_default_ = black;darkyellow
dfocus    = black;yellow
dtitle    = darkred;darkyellow

[menu]
_default_ = black;darkyellow
menusel   = yellow;black
menuhot   = darkred;darkyellow

[buttonbar]
hotkey = yellow;darkred
button = black;yellow

[statusbar]
_default_ = black;yellow

[filehighlight]
directory  = darkred
executable = darkgreen
archive    = red
source     = darkblue
symlink    = black
