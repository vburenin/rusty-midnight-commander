; Apache-2.0 original skin data for Rusty Midnight Commander
; This file uses GNU MC-compatible section/key names (colors only).
; No GPL text is copied. Color pairs are expressed as fg;background.
; Unknown sections/keys are ignored by the loader.
;
; Palette: classic VGA dual-pane (lightgray on blue, cyan frames, black-on-cyan menus).

[core]
_default_  = lightgray;blue
selected   = black;cyan
marked     = yellow;blue
markselect = yellow;cyan
header     = yellow;blue
frame      = cyan;blue
shadow     = black;black
hintbar    = default;default

[dialog]
_default_ = black;lightgray
dfocus    = black;cyan
dtitle    = darkblue;lightgray

[menu]
_default_ = black;cyan
menusel   = white;black
menuhot   = yellow;cyan

[buttonbar]
hotkey = yellow;black
button = black;cyan

[statusbar]
_default_ = black;cyan

[filehighlight]
directory  = white
executable = brightgreen
archive    = brightmagenta
source     = cyan
symlink    = lightgray

[viewer]
_default_  = lightgray;blue
selected  = yellow;cyan

[editor]
_default_ = lightgray;blue
editbold = yellow;green
editmarked = black;cyan
editwhitespace = brightblue;blue
editlinestate = white;cyan
