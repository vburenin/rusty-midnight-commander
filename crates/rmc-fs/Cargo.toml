[package]
name = "rmc-fs"
version = "0.1.0"
edition = "2021"
license.workspace = true
authors.workspace = true
description = "VFS trait and local filesystem implementation for RMC"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
walkdir.workspace = true
time.workspace = true
unicode-width.workspace = true
serde.workspace = true
users.workspace = true
libc = "0.2"
tar = "0.4"
flate2 = { version = "1.0", features = ["rust_backend"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
ftp = "3"
whoami = { workspace = true }
tempfile = "3.10"
cpio_reader = { version = "0.1" }
sevenz-rust2 = { version = "0.21", default-features = true }
iso9660 = { package = "iso9660-rs", version = "1.0" }
gpt_disk_io = { version = "0.16", features = ["std"] }
rars = "0.9"
gpt_disk_types = "0.16"
ar = "0.9"
xz2 = "0.1"
zstd = { version = "0.13", default-features = false, features = ["zstdmt"] }
tokio = { version = "1.39", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
smb2 = "0.19"
russh = "0.54"
russh-sftp = "2.0"
base64 = "0.22"

[dev-dependencies]

# sevenz writer feature for fixtures
sevenz-rust2 = { version = "0.21", features = ["compress"] }

# Test-only helpers to generate tiny fixtures
librarium = { version = "0.6" }
isobemak = { version = "0.4" }
hadris-cpio = { version = "1.1", features = ["sync", "write"] }
rand_core = { version = "0.6", features = ["getrandom"] }
