[workspace]
members = [
    "crates/rmc",
    "crates/rmc-core",
    "crates/rmc-fs",
    "crates/rmc-ui",
    "crates/rmc-view",
    "crates/rmc-edit",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
authors = ["rusty-midnight-commander contributors"]

[workspace.lints.rust]
warnings = "deny"
unused = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "allow"
nursery = "allow"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
crossbeam-channel = "0.5"
unicode-width = "0.1"
walkdir = "2.5"
ratatui = { version = "0.27", default-features = false, features = ["crossterm"] }
crossterm = "0.27"
time = { version = "0.3", features = ["formatting", "macros"] }
users = "0.11"
fs2 = "0.4"
hostname = "0.4"
whoami = "1.5"
